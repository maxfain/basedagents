name: Production canary

# Uptime + health canary for the live deployment. A failing run turns the
# workflow red and GitHub notifies the repo owner — zero-infra monitoring.
#
# Field-hit (runs 164–167, 2026-07-24, ~4h window): Cloudflare's zone rate
# limiting throttled the CANARY itself — the /v1/status body came back as
# "error code: 1027" (edge rate limit, likely tripped by shared GitHub-runner
# egress IPs) and the red runs read as an API outage that never happened.
# Every check now goes through canary_fetch/canary_code: an edge-throttle
# response backs off 60s and retries once, and a persistent throttle fails
# with words that name the edge, not the app.
#
# Optional hardening (no code change needed): set repo secret
# CANARY_BYPASS_SECRET and add a Cloudflare WAF skip rule for requests whose
# X-Canary header equals it — the canary then bypasses rate limiting entirely.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    # Worst case adds one 60s backoff per fetch (6 fetches) on top of curl time.
    timeout-minutes: 10
    env:
      CANARY_BYPASS: ${{ secrets.CANARY_BYPASS_SECRET }}
    steps:
      - name: Prepare throttle-aware fetch
        run: |
          cat > "$RUNNER_TEMP/canary.sh" <<'EOF'
          # canary_fetch <url> — prints the body. canary_code <url> — prints the
          # HTTP status. Both: send the X-Canary bypass header when configured,
          # and treat Cloudflare edge-throttle responses (HTTP 429, or a bare
          # "error code: 10xx" body) as "the edge refused the canary", not as
          # an app failure — back off 60s, retry once, then fail HONESTLY.
          # No curl-level --retry: curl retries 429s itself and CONCATENATES the
          # throttle body with the retried response (verified locally) — the
          # attempt loop below owns all retrying.
          _canary_curl() {
            local hdr=()
            if [ -n "${CANARY_BYPASS:-}" ]; then hdr=(-H "X-Canary: ${CANARY_BYPASS}"); fi
            curl -sS --max-time 15 "${hdr[@]}" "$@"
          }
          _throttled_msg() {
            echo "::error::Cloudflare is still throttling the canary for $1 — this is EDGE rate limiting, not an app outage. Consider the X-Canary bypass (repo secret CANARY_BYPASS_SECRET + a Cloudflare WAF skip rule)." >&2
          }
          canary_fetch() {
            local url="$1" out code body attempt
            for attempt in 1 2; do
              out=$(_canary_curl -w '\n%{http_code}' "$url") || { if [ "$attempt" = 1 ]; then sleep 5; continue; fi; return 1; }
              code=${out##*$'\n'}
              body=${out%$'\n'*}
              if [ "$code" = "429" ] || printf '%s' "$body" | grep -qE '^error code: 10[0-9][0-9]$'; then
                if [ "$attempt" = 1 ]; then
                  echo "::warning::Cloudflare edge throttled the canary for $url (HTTP $code) — backing off and retrying once." >&2
                  sleep "${CANARY_BACKOFF:-60}"
                  continue
                fi
                _throttled_msg "$url"
                return 1
              fi
              printf '%s' "$body"
              return 0
            done
          }
          canary_code() {
            local url="$1" code attempt
            for attempt in 1 2; do
              code=$(_canary_curl -o /dev/null -w '%{http_code}' "$url") || { if [ "$attempt" = 1 ]; then sleep 5; continue; fi; return 1; }
              if [ "$code" = "429" ]; then
                if [ "$attempt" = 1 ]; then
                  echo "::warning::Cloudflare edge throttled the canary for $url (HTTP 429) — backing off and retrying once." >&2
                  sleep "${CANARY_BACKOFF:-60}"
                  continue
                fi
                _throttled_msg "$url"
                return 1
              fi
              printf '%s' "$code"
              return 0
            done
          }
          EOF
          echo "helper written to $RUNNER_TEMP/canary.sh"

      - name: API /v1/status is operational
        run: |
          source "$RUNNER_TEMP/canary.sh"
          body=$(canary_fetch https://api.basedagents.ai/v1/status)
          echo "$body"
          echo "$body" | grep -q '"status":"operational"'

      - name: API DB latency under 3s
        run: |
          source "$RUNNER_TEMP/canary.sh"
          latency=$(canary_fetch https://api.basedagents.ai/v1/status | sed -n 's/.*"db_latency_ms":\([0-9]*\).*/\1/p')
          echo "db_latency_ms=$latency"
          test -n "$latency" && test "$latency" -lt 3000

      - name: Web app responds
        run: |
          source "$RUNNER_TEMP/canary.sh"
          code=$(canary_code https://basedagents.ai)
          echo "basedagents.ai -> $code"
          test "$code" = "200"

      - name: Registry subdomain responds
        run: |
          source "$RUNNER_TEMP/canary.sh"
          code=$(canary_code https://registry.basedagents.ai)
          echo "registry.basedagents.ai -> $code"
          test "$code" = "200"

      - name: OpenAPI + agent discovery documents serve
        run: |
          source "$RUNNER_TEMP/canary.sh"
          canary_fetch https://api.basedagents.ai/openapi.json | grep -q '"openapi"'
          canary_fetch https://basedagents.ai/.well-known/agent.json | grep -q '.'
